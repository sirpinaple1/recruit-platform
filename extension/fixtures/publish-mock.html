<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发布职位 - Mock 招聘平台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #333; background: #f0f2f5; }
  .topbar { height: 52px; background: #fff; border-bottom: 1px solid #e2e6eb; display: flex; align-items: center; padding: 0 32px; }
  .topbar .logo { width: 28px; height: 28px; border-radius: 6px; background: #2f7bf6; color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-right: 10px; }
  .topbar .brand { font-size: 17px; font-weight: 600; }
  .breadcrumb { padding: 14px 32px; color: #888; font-size: 12px; }
  .wrap { max-width: 760px; margin: 0 auto 48px; padding: 0 16px; }
  .section { background: #fff; border-radius: 8px; padding: 24px 28px; margin-bottom: 16px; }
  .section h2 { font-size: 15px; padding-bottom: 14px; margin-bottom: 18px; border-bottom: 1px solid #eef0f3; }
  .form-item { margin-bottom: 18px; }
  .form-item:last-child { margin-bottom: 0; }
  .form-item label { display: block; margin-bottom: 6px; color: #555; font-weight: 500; }
  .required::before { content: "* "; color: #e64340; }
  input[type="text"], input[type="number"], input[type="email"], input[type="date"], input[type="url"], textarea, select {
    width: 100%; padding: 8px 10px; border: 1px solid #d9dee5; border-radius: 5px; font-size: 14px; outline: none; background: #fff;
  }
  input:focus, textarea:focus, select:focus { border-color: #2f7bf6; }
  textarea { min-height: 96px; resize: vertical; }
  .row { display: flex; gap: 14px; }
  .row .form-item { flex: 1; }
  .radio-group { display: flex; gap: 22px; padding-top: 4px; }
  .radio-group label { display: inline-flex; align-items: center; gap: 5px; font-weight: 400; color: #444; margin: 0; cursor: pointer; }
  .captcha-line { display: flex; gap: 10px; align-items: center; }
  .captcha-img { width: 96px; height: 38px; background: repeating-linear-gradient(45deg, #eef2f7, #eef2f7 6px, #e3e9f2 6px, #e3e9f2 12px); border: 1px solid #d9dee5; border-radius: 4px; display: flex; align-items: center; justify-content: center; font: 700 16px/1 Georgia, serif; color: #5a6c85; letter-spacing: 4px; }
  .hint { font-size: 12px; color: #999; margin-top: 4px; }
  .footer-bar { background: #fff; border-radius: 8px; padding: 18px 28px; display: flex; justify-content: flex-end; gap: 12px; }
  .btn-submit { padding: 9px 34px; background: #2f7bf6; color: #fff; border: none; border-radius: 5px; font-size: 15px; cursor: pointer; }
  .btn-submit:hover { background: #2668d9; }
  .btn-reset { padding: 9px 22px; background: #fff; color: #555; border: 1px solid #d9dee5; border-radius: 5px; cursor: pointer; }
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">M</div>
  <span class="brand">Mock 招聘平台 · 企业版</span>
</header>
<nav class="breadcrumb">职位管理 / 发布职位</nav>

<div class="wrap">
  <!--
    与发布中台联调的本地模拟发布页（设计文档 §7/§8）。
    字段定位线索刻意多样化，用于测试填充引擎三级匹配：
    - selector 兜底：#job-title-input
    - <label> 文本：所属部门/招聘人数/职位描述/薪资/学历等
    - 仅 placeholder：工作城市
    - 仅 aria-label：任职要求
    - data-* 属性：工作年限
    - fieldset legend + radio：用工性质
    填充引擎红线（§8）：file 上传、验证码、提交按钮一律跳过，不自动点击。
  -->
  <form id="publish-form" action="#" method="post">

    <section class="section">
      <h2>基本信息</h2>

      <div class="form-item">
        <label class="required" for="job-title-input">职位名称</label>
        <input type="text" id="job-title-input" name="jobTitle" maxlength="40" placeholder="请输入职位名称，如：Java 开发工程师">
      </div>

      <div class="row">
        <div class="form-item">
          <label class="required" for="dept-input">所属部门</label>
          <input type="text" id="dept-input" name="department" placeholder="如：平台研发部">
        </div>
        <div class="form-item">
          <label class="required" for="headcount-input">招聘人数</label>
          <input type="number" id="headcount-input" name="hiringCount" min="1" max="99" placeholder="1-99">
        </div>
      </div>

      <div class="form-item">
        <label class="required" for="category-select">职位类别</label>
        <select id="category-select" name="jobCategory">
          <option value="">请选择</option>
          <option value="tech">技术类</option>
          <option value="product">产品类</option>
          <option value="ops">运营类</option>
          <option value="func">职能类</option>
        </select>
      </div>

      <fieldset class="form-item" id="employment-type-group">
        <legend class="required" style="margin-bottom:6px; color:#555; font-weight:500;">用工性质</legend>
        <div class="radio-group">
          <label><input type="radio" name="jobNature" value="full_time">全职</label>
          <label><input type="radio" name="jobNature" value="part_time">兼职</label>
          <label><input type="radio" name="jobNature" value="internship">实习</label>
          <label><input type="radio" name="jobNature" value="contract">外包</label>
        </div>
      </fieldset>
    </section>

    <section class="section">
      <h2>职位介绍</h2>

      <div class="form-item">
        <label class="required" for="jobdesc-textarea">职位描述</label>
        <textarea id="jobdesc-textarea" name="jobDescription" maxlength="2000" placeholder="请描述岗位职责、工作内容等"></textarea>
      </div>

      <div class="form-item">
        <div class="form-item" style="margin-bottom:0;">
          <textarea id="jobreq-textarea" name="requirement" maxlength="1000" aria-label="任职要求" placeholder="请描述任职要求"></textarea>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>薪资与地点</h2>

      <div class="row">
        <div class="form-item">
          <label class="required" for="salary-min-input">最低薪资(元)</label>
          <input type="number" id="salary-min-input" name="salaryLow" min="0" max="999999" placeholder="如：20000">
        </div>
        <div class="form-item">
          <label class="required" for="salary-max-input">最高薪资(元)</label>
          <input type="number" id="salary-max-input" name="salaryHigh" min="0" max="999999" placeholder="如：35000">
        </div>
        <div class="form-item">
          <label for="salary-text-input">薪资范围</label>
          <input type="text" id="salary-text-input" name="salaryRange" placeholder="如：15-25K">
        </div>
      </div>

      <div class="row">
        <div class="form-item">
          <input type="text" id="city-input" name="workCity" placeholder="请输入工作城市，如：深圳">
        </div>
        <div class="form-item">
          <label class="required" for="exp-input">工作年限</label>
          <input type="number" id="exp-input" name="workYears" data-field="experienceYears" min="0" max="50" placeholder="如：3">
        </div>
        <div class="form-item">
          <label class="required" for="edu-select">学历要求</label>
          <select id="edu-select" name="educationLevel">
            <option value="">请选择</option>
            <option value="any">学历不限</option>
            <option value="associate">大专</option>
            <option value="bachelor">本科</option>
            <option value="master">硕士</option>
            <option value="doctor">博士</option>
          </select>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>其他信息</h2>

      <div class="row">
        <div class="form-item">
          <label for="trackno-input">职位追踪编号</label>
          <input type="text" id="trackno-input" name="trackNo" placeholder="选填，用于追踪来源">
        </div>
        <div class="form-item">
          <label for="pubdate-input">发布日期</label>
          <input type="date" id="pubdate-input" name="publishDate">
        </div>
      </div>

      <div class="form-item">
        <label for="email-input">接收简历邮箱</label>
        <input type="email" id="email-input" name="resumeEmail" placeholder="选填，候选人投递简历将发送至此">
      </div>

      <div class="form-item">
        <label class="required" for="license-file">营业执照</label>
        <input type="file" id="license-file" name="businessLicense" accept="image/*,.pdf">
        <p class="hint">支持 jpg/png/pdf，不超过 5MB（由招聘专员人工上传）</p>
      </div>

      <div class="form-item">
        <label class="required" for="captcha-input">验证码</label>
        <div class="captcha-line">
          <input type="text" id="captcha-input" name="captcha" maxlength="4" style="width:120px;" placeholder="输入右侧字符">
          <span class="captcha-img">A7X3</span>
        </div>
      </div>
    </section>

    <div class="footer-bar">
      <button type="button" class="btn-reset">存草稿</button>
      <button type="submit" class="btn-submit">发布职位</button>
    </div>

  </form>
</div>

</body>
</html>
