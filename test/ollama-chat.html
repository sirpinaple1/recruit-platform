<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollama 本地模型测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .model-selector {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
        }

        .model-selector select {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            background: white;
            color: #333;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.assistant .message-content {
            background: white;
            color: #333;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .message-time {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 5px;
        }

        .typing-indicator {
            display: none;
            padding: 12px 16px;
            background: white;
            border-radius: 18px;
            width: fit-content;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .typing-indicator.active {
            display: block;
        }

        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        .chat-input {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        #userInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        #userInput:focus {
            border-color: #667eea;
        }

        #sendBtn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #sendBtn:hover {
            transform: scale(1.05);
        }

        #sendBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .quick-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .quick-btn {
            padding: 6px 12px;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .status {
            text-align: center;
            padding: 10px;
            font-size: 12px;
            color: #666;
        }

        .status.error {
            color: #e74c3c;
        }

        .status.success {
            color: #27ae60;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🤖 Ollama 本地模型测试</h1>
            <p>与本地 AI 模型对话（已启用 CORS 代理）</p>
            <div class="model-selector">
                <select id="modelSelect">
                    <option value="qwen2.5:7b">Qwen2.5 7B (通用对话)</option>
                    <option value="bge-m3">bge-m3 (向量化模型 - 不支持对话)</option>
                </select>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message assistant">
                <div class="message-content">
                    <div>你好！我是本地运行的 Qwen2.5 模型 👋</div>
                    <div class="message-time">现在</div>
                </div>
            </div>
            <div class="message assistant">
                <div class="message-content">
                    <div>你可以问我任何问题，或者点击下方的快捷按钮体验功能！</div>
                </div>
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="chat-input">
            <div class="quick-actions">
                <button class="quick-btn" onclick="sendQuick('你好，介绍一下你自己')">自我介绍</button>
                <button class="quick-btn" onclick="sendQuick('解析这份简历: 张三，Java工程师，3年工作经验，熟悉Spring Boot')">简历解析</button>
                <button class="quick-btn" onclick="sendQuick('写一个冒泡排序的 Java 代码')">写代码</button>
                <button class="quick-btn" onclick="sendQuick('什么是向量数据库？')">技术问答</button>
                <button class="quick-btn" onclick="clearChat()">清空对话</button>
            </div>
            <div class="input-wrapper">
                <input
                    type="text"
                    id="userInput"
                    placeholder="输入你的问题..."
                    onkeypress="if(event.key==='Enter') sendMessage()"
                >
                <button id="sendBtn" onclick="sendMessage()">发送</button>
            </div>
            <div class="status" id="status">就绪</div>
        </div>
    </div>

    <script>
        // 使用 CORS 代理地址
        const OLLAMA_API = 'http://localhost:8888/api/generate';
        const OLLAMA_TAGS_API = 'http://localhost:8888/api/tags';

        function getCurrentTime() {
            return new Date().toLocaleTimeString('zh-CN', {
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function addMessage(role, content) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            messageDiv.innerHTML = `
                <div class="message-content">
                    <div>${content.replace(/\n/g, '<br>')}</div>
                    <div class="message-time">${getCurrentTime()}</div>
                </div>
            `;

            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const status = document.getElementById('status');
            const typingIndicator = document.getElementById('typingIndicator');
            const modelSelect = document.getElementById('modelSelect');

            const message = input.value.trim();
            if (!message) return;

            const selectedModel = modelSelect.value;
            if (selectedModel === 'bge-m3') {
                status.className = 'status error';
                status.textContent = 'bge-m3 是向量化模型，不支持对话。请选择 Qwen2.5';
                return;
            }

            // 添加用户消息
            addMessage('user', message);
            input.value = '';
            sendBtn.disabled = true;
            typingIndicator.classList.add('active');
            status.className = 'status';
            status.textContent = '正在思考...';

            try {
                const response = await fetch(OLLAMA_API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model: selectedModel,
                        prompt: message,
                        stream: false
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();

                typingIndicator.classList.remove('active');
                addMessage('assistant', data.response);

                status.className = 'status success';
                status.textContent = `✓ 完成 (用时: ${(data.total_duration / 1e9).toFixed(2)}秒)`;

            } catch (error) {
                console.error('Error:', error);
                typingIndicator.classList.remove('active');
                addMessage('assistant', `❌ 错误: ${error.message}\n\n请确认:\n1. CORS 代理服务正在运行 (端口 8888)\n2. Ollama 服务正在运行\n3. 模型 ${selectedModel} 已下载`);

                status.className = 'status error';
                status.textContent = '✗ 请求失败，请检查服务状态';
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        }

        function sendQuick(message) {
            document.getElementById('userInput').value = message;
            sendMessage();
        }

        function clearChat() {
            const messagesDiv = document.getElementById('chatMessages');
            messagesDiv.innerHTML = `
                <div class="message assistant">
                    <div class="message-content">
                        <div>对话已清空，开始新的对话吧！</div>
                        <div class="message-time">${getCurrentTime()}</div>
                    </div>
                </div>
            `;
            document.getElementById('status').textContent = '就绪';
        }

        // 页面加载时检查服务
        window.onload = async () => {
            const status = document.getElementById('status');
            try {
                const response = await fetch(OLLAMA_TAGS_API);
                if (response.ok) {
                    const data = await response.json();
                    const models = data.models.map(m => m.name).join(', ');
                    status.className = 'status success';
                    status.textContent = `✓ 服务已连接 | 可用模型: ${models}`;
                }
            } catch (error) {
                status.className = 'status error';
                status.textContent = '✗ 服务未连接，请确认 CORS 代理和 Ollama 已启动';
            }
        };
    </script>
</body>
</html>
