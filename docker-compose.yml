version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: recruit-mysql
    environment:
      MYSQL_ROOT_PASSWORD: recruit2024
      MYSQL_DATABASE: recruit_platform
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command: --default-time-zone='+08:00' --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - recruit-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-precruit2024"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: recruit-redis
    ports:
      - "6380:6379"
    volumes:
      - ./docker/redis/data:/data
    command: redis-server --appendonly yes --requirepass recruit2024
    networks:
      - recruit-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "recruit2024", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: recruit-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - ./docker/rabbitmq/data:/var/lib/rabbitmq
    networks:
      - recruit-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: recruit-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - ./docker/minio/data:/data
    command: server /data --console-address ":9001"
    networks:
      - recruit-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: recruit-chromadb
    ports:
      - "8001:8000"
    volumes:
      - ./docker/chromadb/data:/chroma/chroma
    environment:
      - ALLOW_RESET=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - recruit-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  recruit-network:
    driver: bridge
