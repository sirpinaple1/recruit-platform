spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3307/recruit_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:recruit2024}
  data:
    redis:
      host: 127.0.0.1
      port: 6380
      database: 0
      password: ${REDIS_PASSWORD:recruit2024}
      timeout: 3s

# JWT 登录态（dev 默认密钥仅本地用，生产走环境变量覆盖）
jwt:
  secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-in-prod-0123456789abcdef}
  expire-hours: ${JWT_EXPIRE_HOURS:24}

logging:
  level:
    com.recruit: debug
