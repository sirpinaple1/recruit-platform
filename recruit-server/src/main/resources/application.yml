server:
  port: 6017

spring:
  application:
    name: recruit-server
  profiles:
    active: dev
  datasource:
    # 会话时区统一钉成 UTC——放在基线配置，dev/prod 共同继承，不依赖各 profile 的 JDBC URL
    # 是否记得带上 connectionTimeZone/forceConnectionTimeZoneToSession 参数。
    # 必要性：DATETIME 列不带时区，DB 的 DEFAULT CURRENT_TIMESTAMP 按会话时区取值，
    # 而应用写入的是 UTC 的 LocalDateTime；二者基准不一致会让时间列出现 ±8h 偏差
    # （T4.5 已因此修过一次存量数据）。用 '+00:00' 而非 'UTC'：数字偏移量不依赖
    # MySQL 是否导入了时区命名表，任何实例都能执行成功。
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
  # 时间统一按 UTC 存储与序列化（见 README 数据约定）
  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd HH:mm:ss
  # 附件上传上限（简历 PDF 实测 130–220KB 量级；20MB 是防误传大文件的护栏）
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

mybatis-plus:
  # Mapper XML 存放位置
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.recruit.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      # 主键用雪花 ID（BIGINT UNSIGNED，见 README 数据约定）
      id-type: assign_id
      table-underline: true

# 附件本地存储（Phase 1 简历采集）
# 目录结构 <root>/<platform>/<yyyyMM>/<file>，启动时自动创建，不可写会直接启动失败。
# Phase 2 若切 MinIO，替换 AttachmentStorageService 的实现即可，调用方不动。
app:
  storage:
    attachment-root: ${ATTACHMENT_ROOT:./data/attachments}
