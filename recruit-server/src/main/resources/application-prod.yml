spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 生产环境连接信息一律走环境变量注入，不写入仓库
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD}
      timeout: 3s

# JWT 登录态：secret 必须由环境变量 JWT_SECRET 注入。
# 刻意不给默认值 —— 缺失时应用启动即失败（fail-fast），
# 避免生产环境误用开发密钥签发 token（JwtUtil 的 @Value("${jwt.secret}") 无默认值，
# 基线 application.yml 也不提供该键；dev 的本地默认值只存在于 application-dev.yml）。
jwt:
  secret: ${JWT_SECRET}
  expire-hours: ${JWT_EXPIRE_HOURS:24}

# recruit-ai-service（Python/FastAPI）：与后端同机部署时默认回环地址，可环境变量覆盖
ai:
  service:
    url: ${AI_SERVICE_URL:http://127.0.0.1:8000}

logging:
  level:
    root: info
    com.recruit: info
