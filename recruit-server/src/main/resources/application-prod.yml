spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 生产环境连接信息一律走环境变量注入，不写入仓库
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD}
      timeout: 3s

logging:
  level:
    root: info
    com.recruit: info
